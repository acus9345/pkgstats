[package]
name = "pkgstats"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui_plot = "0.38.0"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
