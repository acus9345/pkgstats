[package]
name = "pkgstats"
version = "0.1.5"
edition = "2024"
description = "Desktop app for GitHub, npm, PyPI and crates.io stats: users, packages, download charts and daily tracking"
license = "MIT"
repository = "https://github.com/acus9345/pkgstats"
homepage = "https://github.com/acus9345/pkgstats"
readme = "README.md"
keywords = ["github", "npm", "pypi", "crates", "downloads"]
categories = ["gui", "development-tools"]
exclude = ["/target", "/.github"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui_plot = "0.38.0"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
winresource = "0.1.34"

# Optimize the libraries (egui, wgpu, ...) even in debug builds, so `cargo run`
# stays smooth; only PkgStats' own code is left unoptimized for quick rebuilds.
[profile.dev.package."*"]
opt-level = 2
